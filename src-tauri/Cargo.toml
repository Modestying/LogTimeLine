[package]
name = "log-timeline"
version = "0.1.3"
description = "Merge logs and generate a timeline"
authors = ["LogTimeLine"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "log_timeline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
